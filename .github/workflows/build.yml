name: PUBG Tool Search

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Search pak decrypt
        run: curl -s "https://api.github.com/search/repositories?q=pubg+mobile+pak+decrypt&sort=stars&per_page=20" > r1.json

      - name: Search pufferpatch
        run: curl -s "https://api.github.com/search/repositories?q=pufferpatch&sort=stars&per_page=20" > r2.json

      - name: Search pak key
        run: curl -s "https://api.github.com/search/repositories?q=pubg+pak+key&sort=stars&per_page=20" > r3.json

      - name: Search lua dump
        run: curl -s "https://api.github.com/search/repositories?q=pubg+mobile+lua&sort=stars&per_page=20" > r4.json

      - name: Search tencent resource
        run: curl -s "https://api.github.com/search/repositories?q=tencent+game+resource+extractor&sort=stars&per_page=20" > r5.json

      - name: Show results
        run: |
          echo "=== PAK DECRYPT ==="
          cat r1.json | grep -o '"clone_url":"[^"]*"' | head -20
          echo ""
          echo "=== PUFFERPATCH ==="
          cat r2.json | grep -o '"clone_url":"[^"]*"' | head -20
          echo ""
          echo "=== PAK KEY ==="
          cat r3.json | grep -o '"clone_url":"[^"]*"' | head -20
          echo ""
          echo "=== LUA DUMP ==="
          cat r4.json | grep -o '"clone_url":"[^"]*"' | head -20
          echo ""
          echo "=== TENCENT EXTRACTOR ==="
          cat r5.json | grep -o '"clone_url":"[^"]*"' | head -20

      - name: Clone top results
        run: |
          mkdir tools
          for r in $(cat r1.json r2.json r3.json r4.json r5.json | grep '"clone_url"' | sed 's/.*"clone_url":"//;s/"//' | sort -u | head -15); do
            name=$(echo "$r" | sed 's|https://github.com/||;s|\.git||;s|/|_|g')
            git clone --depth 1 "$r" "tools/$name" 2>/dev/null || true
          done
          echo "=== Cloned ==="
          ls -la tools/

      - name: Scan for keys
        run: |
          grep -rE "[0-9a-fA-F]{64}" tools/ --include="*.py" --include="*.lua" --include="*.txt" --include="*.md" --include="*.json" --include="*.h" --include="*.cpp" | head -30
          echo ""
          grep -rE "[0-9a-fA-F]{32}" tools/ --include="*.py" --include="*.lua" --include="*.txt" | head -30
          echo ""
          grep -ri "puffer\|pak_key\|aes_key\|decrypt" tools/ --include="*.py" --include="*.lua" --include="*.md" -l | head -20

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            r1.json
            r2.json
            r3.json
            r4.json
            r5.json
            tools/
