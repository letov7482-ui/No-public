name: PAK Extractor v3

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze pak
        run: |
          echo "=== Файл ==="
          file res_pufferpatch_4.6.0.21559.pak
          echo ""
          echo "=== Первые 128 байт ==="
          xxd res_pufferpatch_4.6.0.21559.pak | head -8
          echo ""
          echo "=== Последние 128 байт ==="
          tail -c 128 res_pufferpatch_4.6.0.21559.pak | xxd
          echo ""
          echo "=== Строки ==="
          strings res_pufferpatch_4.6.0.21559.pak | head -50
          echo ""
          echo "=== Это ZIP? ==="
          python3 -c "
          with open('res_pufferpatch_4.6.0.21559.pak','rb') as f:
              h = f.read(8)
              print('Header:', h.hex())
              if h[:4] == b'PK\x03\x04':
                  print('>>> ЭТО ZIP <<<')
          "

      - name: Extract (если ZIP)
        run: |
          mkdir -p output
          python3 -c "
          import zipfile
          try:
              with zipfile.ZipFile('res_pufferpatch_4.6.0.21559.pak','r') as z:
                  z.extractall('output/')
                  print('Распаковано:', len(z.namelist()), 'файлов')
                  for n in z.namelist()[:50]:
                      print(' ', n)
          except:
              print('Не ZIP, идём дальше')
          "

      - name: UE4 Pak Reader (Python)
        run: |
          pip install cryptography zstandard
          python3 << 'PYEOF'
          import struct, os, sys

          FILENAME = "res_pufferpatch_4.6.0.21559.pak"
          UE4_MAGIC = b'\xE1\x12\x6F\x5A'

          with open(FILENAME, 'rb') as f:
              size = os.path.getsize(FILENAME)
              print(f"Размер файла: {size} bytes")

              # Читаем последние 300 байт — ищем magic
              f.seek(max(0, size - 300))
              tail = f.read(300)

              idx = tail.rfind(UE4_MAGIC)
              if idx < 0:
                  # Ищем в начале
                  f.seek(0)
                  head = f.read(4)
                  if head == UE4_MAGIC:
                      print("[+] Magic в начале")
                      idx = size - 300 + 0
                  else:
                      print("[-] UE4 magic не найден")
                      print("    Голова:", head.hex())
                      print("    Конец:", tail[-64:].hex())
                      sys.exit(0)

              # Парсим footer
              footer_pos = max(0, size - 300) + idx
              f.seek(footer_pos)
              footer = f.read(44)

              magic = footer[0:4]
              version = struct.unpack('<i', footer[4:8])[0]
              index_offset = struct.unpack('<q', footer[8:16])[0]
              index_size = struct.unpack('<q', footer[16:24])[0]

              print(f"[+] UE4 Pak найден!")
              print(f"    Version: {version}")
              print(f"    Index offset: {index_offset}")
              print(f"    Index size: {index_size}")

              # Читаем index
              f.seek(index_offset)
              index_data = f.read(min(index_size, 100000))

              # Пробуем читать без расшифровки
              try:
                  offset = 0
                  mount_len = struct.unpack('<i', index_data[0:4])[0]
                  offset += 4
                  if 0 < mount_len < 512:
                      mount = index_data[offset:offset+mount_len]
                      offset += mount_len
                      num_entries = struct.unpack('<i', index_data[offset:offset+4])[0]
                      offset += 4
                      print(f"[+] Mount: {mount}")
                      print(f"[+] Файлов: {num_entries}")

                      for i in range(min(num_entries, 200)):
                          flen = struct.unpack('<i', index_data[offset:offset+4])[0]
                          offset += 4
                          fname = index_data[offset:offset+flen].decode('utf-8', errors='replace')
                          offset += flen
                          foff = struct.unpack('<q', index_data[offset:offset+8])[0]
                          fsize = struct.unpack('<q', index_data[offset+8:offset+16])[0]
                          offset += 16 + 20
                          print(f"  {fname} [{fsize}b]")
                  else:
                      print("[-] Index зашифрован — mount_len =", mount_len)
              except Exception as e:
                  print(f"[-] Ошибка парсинга: {e}")
                  print("    Index скорее всего зашифрован")

          PYEOF

      - name: Force extract all (carve by signatures)
        run: |
          python3 << 'PYEOF'
          import os, struct

          FILENAME = "res_pufferpatch_4.6.0.21559.pak"
          os.makedirs("carved", exist_ok=True)

          # Сигнатуры известных форматов внутри pak
          SIGS = {
              b'PNG\r\n\x1a\n': 'png',
              b'\xff\xd8\xff': 'jpg',
              b'OggS': 'ogg',
              b'RIFF': 'wav',
              b'ID3': 'mp3',
              b'\x1f\x8b': 'gzip',
              b'PK\x03\x04': 'zip_inner',
              b'\x04\x22\x4D\x18': 'lz4',
              b'\x28\xB5\x2F\xFD': 'zstd',
              b'UCS2': 'utf16',
          }

          with open(FILENAME, 'rb') as f:
              data = f.read()

          print(f"Сканирую {len(data)} bytes...")
          found = 0
          for sig, ext in SIGS.items():
              pos = 0
              count = 0
              while True:
                  pos = data.find(sig, pos)
                  if pos < 0:
                      break
                  count += 1
                  if count <= 5:
                      out = f"carved/offset_{pos:08x}.{ext}"
                      # Вырезаем 64KB после сигнатуры
                      with open(out, 'wb') as out_f:
                          out_f.write(data[pos:pos+65536])
                  pos += 1
              if count > 0:
                  print(f"  {ext}: {count} найдено")
                  found += count

          print(f"\nВсего сигнатур: {found}")
          PYEOF

          # Zstd/lz4 распаковка
          pip install zstandard lz4
          python3 << 'PYEOF'
          import os, zstandard, lz4.frame

          for f in os.listdir('carved'):
              fp = os.path.join('carved', f)
              try:
                  with open(fp, 'rb') as inf:
                      raw = inf.read()
                  if raw[:4] == b'\x28\xB5\x2F\xFD':
                      dec = zstandard.ZstdDecompressor().decompress(raw)
                      out = fp + '.dec'
                      with open(out, 'wb') as ouf:
                          ouf.write(dec)
                      print(f"[+] {f} → zstd распакован ({len(dec)}b)")
                  elif raw[:4] == b'\x04\x22\x4D\x18':
                      dec = lz4.frame.decompress(raw)
                      out = fp + '.dec'
                      with open(out, 'wb') as ouf:
                          ouf.write(dec)
                      print(f"[+] {f} → lz4 распакован ({len(dec)}b)")
              except:
                  pass
          PYEOF

      - name: Results
        run: |
          echo "=== Распаковано ==="
          find output/ -type f 2>/dev/null | head -100
          echo ""
          echo "=== Carved ==="
          find carved/ -type f 2>/dev/null | head -100
          echo ""
          du -sh output/ carved/ 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pufferpatch-v3
          path: |
            output/
            carved/
