name: Search PUBG Dumps v2

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Search
        run: |
          curl -s "https://api.github.com/search/repositories?q=pubg+mobile+decompile+lua&per_page=30" > s1.json
          curl -s "https://api.github.com/search/repositories?q=shadowtracker+extra+lua&per_page=30" > s2.json
          curl -s "https://api.github.com/search/repositories?q=pubg+mobile+cheat+lua&per_page=30" > s3.json
          curl -s "https://api.github.com/search/repositories?q=pak+extract+tencent+mobile&per_page=30" > s4.json

      - name: Parse results
        run: |
          python3 -c "
          import json
          for f in ['s1.json', 's2.json', 's3.json', 's4.json']:
              print(f'=== {f} ===')
              try:
                  d = json.load(open(f))
                  for item in d.get('items', []):
                      print(f'{item[\"stargazers_count\"]:>4}* {item[\"clone_url\"]}')
                      if item.get('description'):
                          print(f'     {item[\"description\"][:80]}')
                  print()
              except Exception as e:
                  print(f'error: {e}')
          "

      - name: Clone top 10
        run: |
          mkdir dump
          python3 -c "
          import json, subprocess, os
          urls = set()
          for f in ['s1.json', 's2.json', 's3.json', 's4.json']:
              try:
                  d = json.load(open(f))
                  for item in d.get('items', []):
                      if item['stargazers_count'] >= 0:
                          urls.add(item['clone_url'])
              except: pass
          for url in list(urls)[:10]:
              name = url.replace('https://github.com/', '').replace('.git', '').replace('/', '_')
              print(f'Cloning: {name}')
              subprocess.run(['git', 'clone', '--depth', '1', url, f'dump/{name}'],
                           capture_output=True, timeout=60)
          "
          echo "=== Cloned ==="
          ls -la dump/

      - name: Find lua
        run: |
          find dump/ -name "*.lua" -o -name "*.luac" 2>/dev/null | head -50
          echo ""
          echo "=== Lua file count ==="
          find dump/ -name "*.lua" 2>/dev/null | wc -l

      - name: Show samples
        run: |
          for f in $(find dump/ -name "*.lua" 2>/dev/null | head -3); do
            echo "=== $f ==="
            head -50 "$f"
            echo ""
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dumps
          path: dump/
        if-no-files-found: ignore
