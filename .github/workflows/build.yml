name: PAK Mod Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract
        run: |
          python3 << 'EOF'
          import os, zlib, json
          fn = "res_pufferpatch_4.6.0.21559.pak"
          data = open(fn, "rb").read()
          os.makedirs("extracted", exist_ok=True)
          pos = 0
          num = 0
          streams = []
          while pos < len(data) and num < 500:
              idx = data.find(b"\x1f\x8b", pos)
              if idx < 0:
                  break
              try:
                  d = zlib.decompressobj(31)
                  dec = d.decompress(data[idx:])
                  dec += d.flush()
                  if len(dec) > 0:
                      end = len(data) - len(d.unused_data)
                      sf = f"extracted/stream_{num:03d}.bin"
                      open(sf, "wb").write(dec)
                      ftype = "binary"
                      if dec[:4] == b"\x1bLua":
                          ftype = "LUA"
                      elif dec[:1] == b"{":
                          ftype = "JSON"
                      else:
                          try:
                              t = dec[:80].decode("utf-8")
                              if all(c.isprintable() or c in "\n\r\t" for c in t):
                                  ftype = "TEXT"
                          except:
                              pass
                      print(f"[{num:02d}] @{idx:#08x} {len(dec)}b {ftype}")
                      streams.append({"index": num, "start": idx, "end": end, "file": sf, "type": ftype})
                      num += 1
                      pos = end
              except:
                  pos = idx + 2
          print(f"Total: {num}")
          json.dump(streams, open("streams.json", "w"), indent=2)
          json.dump({"filename": fn, "size": len(data)}, open("pak_info.json", "w"), indent=2)
          EOF

      - name: Inject
        run: |
          python3 << 'EOF'
          import os, json, shutil
          if not os.path.exists("streams.json"):
              exit(0)
          streams = json.load(open("streams.json"))
          mods_dir = "mods"
          if not os.path.exists(mods_dir) or not os.listdir(mods_dir):
              print("No mods — extraction only")
              exit(0)
          for mfile in sorted(os.listdir(mods_dir)):
              mpath = os.path.join(mods_dir, mfile)
              if os.path.isdir(mpath):
                  continue
              if mfile.startswith("replace_stream_"):
                  sidx = int(mfile.replace("replace_stream_", "").split(".")[0])
                  for s in streams:
                      if s["index"] == sidx:
                          print(f"Replacing stream {sidx}")
                          shutil.copy2(mpath, s["file"])
                          break
          EOF

      - name: Repack
        run: |
          python3 << 'EOF'
          import os, json, gzip, io
          if not os.path.exists("streams.json"):
              exit(0)
          streams = json.load(open("streams.json"))
          info = json.load(open("pak_info.json"))
          original = open(info["filename"], "rb").read()
          output = bytearray(original)
          mod_count = 0
          for s in streams:
              fp = s["file"]
              if not os.path.exists(fp):
                  continue
              content = open(fp, "rb").read()
              buf = io.BytesIO()
              with gzip.GzipFile(fileobj=buf, mode="wb", mtime=0) as gz:
                  gz.write(content)
              new_gz = buf.getvalue()
              orig_len = s["end"] - s["start"]
              if len(new_gz) <= orig_len:
                  output[s["start"]:s["end"]] = new_gz + b"\x00" * (orig_len - len(new_gz))
                  mod_count += 1
              else:
                  print(f"Stream {s['index']}: too big, skip")
          out_name = "modded_" + info["filename"]
          open(out_name, "wb").write(bytes(output))
          print(f"Saved {out_name} — {mod_count} streams modified")
          EOF

      - name: Upload extracted
        uses: actions/upload-artifact@v4
        with:
          name: extracted
          path: |
            extracted/
            streams.json

      - name: Upload modded pak
        uses: actions/upload-artifact@v4
        with:
          name: modded-pak
          path: modded_*.pak
        continue-on-error: true
