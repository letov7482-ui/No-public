name: PUBG Extract v3

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apkeep
        run: |
          cargo install apkeep --locked || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download APK
        run: |
          apkeep -d apkpure com.tencent.ig apk_out/
          find apk_out/ -type f -exec ls -lh {} \;

      - name: Extract libs
        run: |
          mkdir libs
          for f in $(find apk_out/ -name "*.apk" -o -name "*.xapk" -o -name "*.zip"); do
            unzip -o "$f" "lib/arm64-v8a/*.so" -d libs/ 2>/dev/null || true
            unzip -o "$f" "lib/armeabi-v7a/*.so" -d libs/ 2>/dev/null || true
          done
          find libs/ -name "*.so" -exec ls -lh {} \;

      - name: Find keys
        run: |
          python3 << 'EOF'
          import os, re
          so_files = []
          for root, dirs, files in os.walk('libs'):
              for f in files:
                  if f.endswith('.so'):
                      so_files.append(os.path.join(root, f))
          print(f"Found {len(so_files)} libs")
          keys = set()
          for lib in so_files:
              data = open(lib, 'rb').read()
              for m in re.finditer(rb'[0-9a-fA-F]{64}', data):
                  h = m.group().decode()
                  kb = bytes.fromhex(h)
                  if len(set(kb)) > 12:
                      keys.add(h)
              for m in re.finditer(rb'[0-9a-fA-F]{32}', data):
                  h = m.group().decode()
                  kb = bytes.fromhex(h)
                  if len(set(kb)) > 8:
                      keys.add(h)
          open('found_keys.txt', 'w').write('\n'.join(keys))
          print(f"Total: {len(keys)}")
          for k in sorted(keys)[:40]:
              print(k)
          EOF

      - name: Upload keys
        uses: actions/upload-artifact@v4
        with:
          name: keys
          path: found_keys.txt
