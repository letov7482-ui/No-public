name: Search PUBG dumps

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Search repositories
        run: |
          curl -s "https://api.github.com/search/repositories?q=pubg+mobile+dump+lua+decompile&per_page=20" > s1.json
          curl -s "https://api.github.com/search/repositories?q=shadowtracker+lua&per_page=20" > s2.json
          curl -s "https://api.github.com/search/code?q=puffer+lua+decrypt" > s3.json
          curl -s "https://api.github.com/search/repositories?q=pubg+mobile+assets+extract&per_page=20" > s4.json

      - name: Show
        run: |
          echo "=== DUMP ==="
          cat s1.json | grep '"clone_url"' | head -20
          echo ""
          echo "=== SHADOWTRACKER ==="
          cat s2.json | grep '"clone_url"' | head -20
          echo ""
          echo "=== CODE SEARCH ==="
          cat s3.json | grep '"path"' | head -20
          echo ""
          echo "=== ASSETS ==="
          cat s4.json | grep '"clone_url"' | head -20

      - name: Clone interesting
        run: |
          mkdir dump
          for r in $(cat s1.json s2.json s4.json | grep '"clone_url"' | sed 's/.*"clone_url":"//;s/"//' | sort -u | head -10); do
            name=$(echo "$r" | sed 's|https://github.com/||;s|\.git||;s|/|_|g')
            git clone --depth 1 "$r" "dump/$name" 2>/dev/null || true
          done
          echo "=== Cloned ==="
          ls -la dump/

      - name: Look for lua
        run: |
          find dump/ -name "*.lua" -o -name "*.luac" | head -50
          find dump/ -name "*.pak" | head -20
          find dump/ -name "*.so" | head -20
          find dump/ -type d | head -30

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dump-results
          path: dump/
