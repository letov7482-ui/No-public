name: Clone PUBG Lua

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Lua Scripts
        run: git clone https://github.com/0xPrince/PUBG-Mobile-Lua-Scripts.git lua_scripts

      - name: Clone MasterLua
        run: git clone https://github.com/beyondbday69/MasterLua.git master_lua

      - name: Explore
        run: |
          echo "=== PUBG Lua Scripts ==="
          find lua_scripts/ -type f | head -50
          echo ""
          echo "Total files: $(find lua_scripts/ -type f | wc -l)"
          echo ""
          echo "=== Lua files ==="
          find lua_scripts/ -name "*.lua" | head -30
          echo ""
          echo "=== Content sample ==="
          for f in $(find lua_scripts/ -name "*.lua" | head -5); do
            echo "--- $f ---"
            head -30 "$f"
            echo ""
          done
          echo ""
          echo "=== MasterLua ==="
          find master_lua/ -type f | head -20

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pubg-lua
          path: |
            lua_scripts/
            master_lua/
