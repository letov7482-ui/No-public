name: PUBG APK Download + Key Extract + PAK Decrypt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          pip install cryptography zstandard lz4
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip

      - name: Download APK
        run: |
          mkdir -p apk
          
          # APKPure
          wget -q -O apk/pubg.xapk "https://d.apkpure.com/b/XAPK/com.tencent.ig?version=latest" 2>/dev/null || true
          
          if [ -f apk/pubg.xapk ]; then
            file apk/pubg.xapk
            unzip -o apk/pubg.xapk -d apk/xapk/
            echo "=== XAPK contents ==="
            ls -la apk/xapk/
          else
            echo "APKPure не сработал"
          fi
          
          # APKMirror fallback
          if [ ! -f apk/pubg.xapk ]; then
            wget -q -O apk/pubg.apk "https://d.apkpure.com/b/APK/com.tencent.ig?version=latest" 2>/dev/null || true
            if [ -f apk/pubg.apk ]; then
              file apk/pubg.apk
            fi
          fi
          
          ls -la apk/

      - name: Extract libs
        run: |
          mkdir -p libs
          
          # Если XAPK — это zip с несколькими APK внутри
          if [ -d apk/xapk ]; then
            for f in apk/xapk/*.apk; do
              echo "Extracting from: $f"
              unzip -o "$f" "lib/arm64-v8a/*.so" -d libs/ 2>/dev/null || true
              unzip -o "$f" "lib/armeabi-v7a/*.so" -d libs/ 2>/dev/null || true
            done
          fi
          
          # Если обычный APK
          if [ -f apk/pubg.apk ]; then
            unzip -o apk/pubg.apk "lib/arm64-v8a/*.so" -d libs/ 2>/dev/null || true
          fi
          
          echo "=== Libraries ==="
          find libs/ -name "*.so" -exec ls -la {} \;
          
          # Копируем главные библиотеки
          for lib in libUE4.so libil2cpp.so libtersafe2.so libshellx_super.so libSGMain.so libSecMon.so; do
            found=$(find libs/ -name "$lib" | head -1)
            if [ -n "$found" ]; then
              cp "$found" ./
              echo "[+] Copied: $lib ($(stat -c%s "$found") bytes)"
            fi
          done

      - name: Extract AES key
        run: |
          python3 << 'PYEOF'
          import os, re, struct, hashlib

          # Собираем все .so файлы
          libs = []
          for f in os.listdir('.'):
              if f.endswith('.so'):
                  libs.append(f)
          for root, dirs, files in os.walk('libs'):
              for f in files:
                  if f.endswith('.so'):
                      libs.append(os.path.join(root, f))

          if not libs:
              print("[-] No .so files found")
              exit(1)

          all_keys = set()

          for lib_path in libs:
              size = os.path.getsize(lib_path)
              if size < 1000:
                  continue
              print(f"\n=== {lib_path} ({size} bytes) ===")

              data = open(lib_path, 'rb').read()

              # 64-char hex strings (AES-256 keys)
              hex64 = re.findall(rb'[0-9a-fA-F]{64}', data)
              for h in set(hex64):
                  off = data.find(h)
                  kb = bytes.fromhex(h.decode())
                  # Фильтр — ключ не должен быть нулями
                  if kb != b'\x00' * 32 and len(set(kb)) > 10:
                      print(f"  HEX64 @{off:#x}: {h.decode()}")
                      all_keys.add(h.decode())

              # 32-char hex strings (AES-128 keys)
              hex32 = re.findall(rb'[0-9a-fA-F]{32}', data)
              for h in set(hex32):
                  off = data.find(h)
                  kb = bytes.fromhex(h.decode())
                  if kb != b'\x00' * 16 and len(set(kb)) > 8:
                      print(f"  HEX32 @{off:#x}: {h.decode()}")
                      all_keys.add(h.decode())

              # Key markers
              for marker in [b'pak_key', b'aes_key', b'PAKKEY', b'encryption_key', b'secret_key']:
                  idx = 0
                  while True:
                      idx = data.find(marker, idx)
                      if idx < 0: break
                      ctx = data[max(0,idx-32):idx+128]
                      hexes = re.findall(rb'[0-9a-fA-F]{32,64}', ctx)
                      for h in hexes:
                          print(f"  MARKER[{marker.decode()}] @{idx:#x}: {h.decode()}")
                          all_keys.add(h.decode())
                      idx += 1

              # Raw high-entropy 32-byte blocks near "pak" strings
              for marker in [b'puffer', b'pak', b'PAK']:
                  idx = 0
                  while True:
                      idx = data.find(marker, idx)
                      if idx < 0: break
                      # Check nearby 32-byte blocks
                      for delta in [-64, -32, 0, 32, 64, 128]:
                          off = idx + delta
                          if 0 <= off < len(data) - 32:
                              block = data[off:off+32]
                              if len(set(block)) > 20:
                                  print(f"  RAW near '{marker.decode()}' @{off:#x}: {block.hex()}")
                                  all_keys.add(block.hex())
                      idx += 1

          # Save all unique keys
          with open('found_keys.txt', 'w') as f:
              for k in sorted(all_keys):
                  f.write(k + '\n')

          print(f"\n[+] Total unique keys: {len(all_keys)}")
          for k in sorted(all_keys):
              print(f"  {k}")
          PYEOF

      - name: Decrypt PAK with found keys
        run: |
          python3 << 'PYEOF'
          import os, struct, zlib, json, math
          from collections import Counter
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes

          PAK = "res_pufferpatch_4.6.0.21559.pak"
          if not os.path.exists(PAK):
              print("[-] No pak file")
              exit(1)

          data = open(PAK, 'rb').read()
          print(f"PAK: {len(data)} bytes, magic: {data[:4].hex()}")

          # Load keys
          keys = []
          if os.path.exists('found_keys.txt'):
              for line in open('found_keys.txt'):
                  k = line.strip()
                  if len(k) == 64:
                      keys.append(bytes.fromhex(k))
                  elif len(k) == 32:
                      keys.append(bytes.fromhex(k).ljust(32, b'\x00'))

          print(f"Testing {len(keys)} keys...")

          # Test each key against first 64 bytes of data
          for ki, key in enumerate(keys):
              for mode_name, mode in [("ECB", modes.ECB()), ("CBC-zero-iv", modes.CBC(b'\x00'*16))]:
                  try:
                      cipher = Cipher(algorithms.AES(key), mode)
                      dec = cipher.decryptor()
                      # Decrypt first 128 bytes (8 AES blocks)
                      decrypted = dec.update(data[:128]) + dec.finalize()

                      # Check for known signatures
                      for sig, name in [
                          (b'\x1bLua', 'LUA'), (b'PK\x03\x04', 'ZIP'),
                          (b'\x78\x01', 'ZLIB'), (b'\x1f\x8b', 'GZIP'),
                          (b'PNG', 'PNG'), (b'OggS', 'OGG'),
                      ]:
                          if decrypted[:len(sig)] == sig or sig in decrypted[:64]:
                              print(f"\n[+] KEY FOUND! #{ki} {mode_name}")
                              print(f"    Key: {key.hex()}")
                              print(f"    Signature: {name}")
                              print(f"    Decrypted head: {decrypted[:32].hex()}")
                              print(f"    Decrypted text: {decrypted[:60]}")

                              # Save full decryption
                              dec2 = Cipher(algorithms.AES(key), mode).decryptor()
                              full_dec = dec2.update(data) + dec2.finalize()
                              open('decrypted_pak.bin', 'wb').write(full_dec)
                              print(f"    Saved decrypted_pak.bin ({len(full_dec)}b)")

                      # Check if entropy dropped (decryption worked)
                      c = Counter(decrypted[:128])
                      if len(c) > 5:
                          ent = -sum((v/len(decrypted[:128])) * math.log2(v/len(decrypted[:128])) for v in c.values())
                          if ent < 6.0:
                              print(f"  Key #{ki} {mode_name}: LOW ENTROPY {ent:.2f} — possible hit!")
                              print(f"    Key: {key.hex()}")
                              print(f"    Data: {decrypted[:32].hex()}")
                  except Exception as e:
                      pass

          # Also try decrypting the index (assuming it's at the end)
          print("\n=== Decrypting last 256 bytes (possible index) ===")
          for ki, key in enumerate(keys):
              try:
                  cipher = Cipher(algorithms.AES(key), modes.ECB())
                  dec = cipher.decryptor()
                  dec_last = dec.update(data[-256:]) + dec.finalize()
                  # Check for readable strings
                  strings = [dec_last[i:i+4] for i in range(0, len(dec_last), 4)]
                  printable = sum(1 for s in strings if all(32 <= b <= 126 for b in s))
                  if printable > 10:
                      print(f"  Key #{ki}: {printable}/64 printable blocks")
                      print(f"    {dec_last[:64]}")
              except:
                  pass

          # Try XOR with each key on header
          print("\n=== XOR testing ===")
          for ki, key in enumerate(keys):
              for xor_len in [4, 8, 16]:
                  xk = key[:xor_len]
                  test = bytes(a ^ b for a, b in zip(data[:64], (xk * (64 // xor_len + 1))[:64]))
                  if test[:2] in [b'\x78\x01', b'\x78\x9c', b'\x78\xda']:
                      print(f"  XOR key #{ki} len={xor_len} → ZLIB!")
                      print(f"    Key: {key.hex()}")
                      break
                  if test[:2] == b'\x1f\x8b':
                      print(f"  XOR key #{ki} len={xor_len} → GZIP!")
                      break

          print("\n=== Done ===")
          PYEOF

      - name: If decrypted — extract content
        run: |
          if [ -f decrypted_pak.bin ]; then
            python3 << 'PYEOF'
            import os, zlib, json

            data = open('decrypted_pak.bin', 'rb').read()
            os.makedirs('extracted', exist_ok=True)

            # Try carving zlib/gzip from decrypted data
            pos = 0
            num = 0
            while pos < len(data) and num < 500:
                idx = data.find(b'\x1f\x8b', pos)
                if idx < 0:
                    idx2 = data.find(b'\x78\x9c', pos)
                    if idx2 < 0:
                        idx2 = data.find(b'\x78\x01', pos)
                    idx = idx2
                if idx < 0:
                    break

                for wbits in [31, 15]:
                    try:
                        d = zlib.decompressobj(wbits)
                        dec = d.decompress(data[idx:idx+1048576])
                        if len(dec) > 20:
                            ftype = dec[:20].hex()
                            out = f"extracted/file_{num:03d}_{ftype[:12]}.bin"
                            open(out, 'wb').write(dec)
                            print(f"[{num:02d}] @{idx:#x} → {len(dec)}b [{dec[:16]}]")
                            num += 1
                        break
                    except:
                        continue
                pos = idx + 2

            print(f"\nExtracted: {num} files")
            PYEOF
          else
            echo "No decrypted_pak.bin — decryption failed"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pubg-results
          path: |
            found_keys.txt
            decrypted_pak.bin
            extracted/
          if-no-files-found: ignore

      - name: Upload libs (for manual analysis)
        uses: actions/upload-artifact@v4
        with:
          name: pubg-libs
          path: |
            libUE4.so
            libil2cpp.so
            libtersafe2.so
            libs/
          if-no-files-found: ignore
